<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>打地鼠大作战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐭 打地鼠大作战 🐭</h1>
        
        <div class="game-info">
            <div class="info-card">
                <span class="label">得分</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="info-card">
                <span class="label">剩余时间</span>
                <span id="timer" class="value">30</span>
            </div>
        </div>

        <div class="player-section">
            <input type="text" id="playerName" placeholder="输入你的名字" maxlength="20" value="玩家">
            <button id="startBtn" class="btn start">开始游戏</button>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- 6x6 格子由 JS 动态生成 -->
        </div>

        <div class="leaderboard">
            <h2>🏆 高分榜 🏆</h2>
            <table id="leaderboardTable">
                <thead>
                    <tr><th>玩家</th><th>分数</th><th>时间</th></tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr><td colspan="3">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
